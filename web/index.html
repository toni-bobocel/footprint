<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Footprint</title>
    <meta name="description" content="Find businesses anywhere in the world and see what their online presence is missing." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23171a20' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e31937'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas class="globe" aria-label="Globe. Click anywhere to search around that point."></canvas>
    <div class="atlas" aria-hidden="true"></div>

    <header class="top">
      <a class="mark" href="./">Footprint</a>
      <nav>
        <button class="link" type="button" data-sheet="how" data-t="nav.how">How it works</button>
        <button class="link" type="button" data-sheet="sources" data-t="nav.sources">Sources</button>
        <a class="link" href="https://github.com/toni-bobocel/footprint" data-t="nav.code">Code</a>
        <div class="lang">
          <button class="link lang-now" type="button" aria-haspopup="true" aria-expanded="false">EN</button>
          <ul class="langs" hidden></ul>
        </div>
      </nav>
    </header>

    <main class="hero">
      <h1 class="title">Every business on Earth.<br />And what it's missing.</h1>
      <form class="search" autocomplete="off">
        <label class="sr" for="q">Search businesses</label>
        <input id="q" name="q" type="text" spellcheck="false" maxlength="300" />
        <span class="ghost" aria-hidden="true"></span>
        <span class="line" aria-hidden="true"></span>
        <button class="go" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" /></svg>
        </button>
      </form>
      <p class="hint" data-t="hint">Type a search, or click anywhere on the globe.</p>
      <div class="picked" hidden>
        <p class="pin-name"></p>
        <div class="radius">
          <div class="track"><span class="fill"></span><span class="knob" tabindex="0" role="slider" aria-label="Search radius" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></span></div>
          <span class="km"></span>
        </div>
        <div class="pin-acts">
          <button class="act" type="button" data-act="here" data-t="searchHere">Search here</button>
          <button class="act quiet" type="button" data-act="cancel" data-t="cancel">Cancel</button>
        </div>
      </div>
    </main>

    <div class="pin" hidden><span class="cross" aria-hidden="true"></span></div>

    <aside class="results" hidden>
      <div class="r-head">
        <button class="act back" type="button" data-t="newSearch">New search</button>
        <h2 class="r-title">Results</h2>
        <p class="r-meta"><span class="r-count">0</span> <span class="r-status"></span></p>
      </div>
      <div class="r-tools">
        <div class="filters">
          <span class="tools-label" data-t="missing">Missing</span>
        </div>
        <div class="sort">
          <span class="tools-label" data-t="sort">Sort</span>
          <button class="toggle on" type="button" data-sort="opportunity" data-t="opportunity">Opportunity</button>
          <button class="toggle" type="button" data-sort="distance" data-t="distance">Distance</button>
          <button class="toggle" type="button" data-sort="name" data-t="name">Name</button>
        </div>
      </div>
      <ol class="list"></ol>
      <div class="r-foot">
        <p class="depth"></p>
        <button class="act" type="button" data-act="csv" data-t="exportCsv">Export CSV</button>
      </div>
    </aside>

    <aside class="detail" hidden aria-live="polite"></aside>

    <section class="sheet" hidden>
      <button class="act close" type="button" data-t="d.close">Close</button>
      <article data-sheet="how"></article>
      <article data-sheet="sources"></article>
    </section>

    <p class="toast" role="status" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
