name: pages

on:
  push:
    branches: [main]
    paths: [web/**, shared/**, pnpm-lock.yaml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No API behind Pages: the page falls back to querying open data itself.
      # Set the FOOTPRINT_API repository variable to point it at a deployed API.
      - run: pnpm --filter @footprint/web build
        env:
          BASE: /footprint/
          VITE_API: ${{ vars.FOOTPRINT_API }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
